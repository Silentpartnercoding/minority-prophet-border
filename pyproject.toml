[project]
name = "minority-prophet-border"
version = "0.2.0"
description = "Neutral admission and evidence-provenance boundary for agentic systems."
authors = [{name = "James Siyuan He"}]
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"

[project.optional-dependencies]
sandbox = [
  "PyJWT[crypto]>=2.10,<3",
  "gunicorn>=23,<24",
  "minority-prophet-gate @ https://github.com/Silentpartnercoding/minority-prophet-gate/archive/82a0e8765b71e41c4f29249f7025f0e21627c4f7.tar.gz",
]

[project.scripts]
minority-prophet-border-keygen = "border.keygen:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["border*"]
